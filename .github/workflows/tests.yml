name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install UI dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile app.py bootstrap.py session_inventory.py tests/test_session_inventory.py tests/test_app_smoke.py tests/test_windows_launcher.py tests/test_bootstrap_contract.py
      - name: Run unit and UI smoke tests
        run: python -m unittest discover -s tests -v
